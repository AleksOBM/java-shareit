server:
  port: 9090

spring:
  main:
    banner-mode: OFF
  sql:
    init:
      mode: ALWAYS
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      INDENT_OUTPUT: true
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/shareit
    username: shareit
    password: shareit

hibernate:
  default-schema: public
  show-sql: true
  format-sql: true

logging:
  level:
    root: info
    org:
      zalando:
        logbook: trace
